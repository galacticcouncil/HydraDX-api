name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API app
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-app
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api:latest
            greenjay/hydration-api:${{ github.sha }}

      - name: Build and push API jobs
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-jobs
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api-jobs:latest
            greenjay/hydration-api-jobs:${{ github.sha }}

      - name: Update services on Swarmpit
        run: |
          SHA="${{ github.sha }}"
          SERVICES=$(curl -s "${{ secrets.SWARMPIT_URL }}/api/services" \
            -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}")

          update_service() {
            local NAME="$1"
            local IMAGE="$2"
            local SERVICE_ID
            SERVICE_ID=$(echo "$SERVICES" | jq -r --arg name "$NAME" '.[] | select(.serviceName == $name) | .id')
            if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "null" ]; then
              echo "Service $NAME not found"
              exit 1
            fi

            echo "Updating $NAME to image $IMAGE ..."
            # Get current service spec
            SERVICE_JSON=$(curl -s "${{ secrets.SWARMPIT_URL }}/api/services/$SERVICE_ID" \
              -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}")

            # Update the image tag in the spec
            UPDATED=$(echo "$SERVICE_JSON" | jq --arg img "$IMAGE" '.repository.tag = ($img | split(":")[1])')

            # POST the updated service
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              -X POST "${{ secrets.SWARMPIT_URL }}/api/services/$SERVICE_ID" \
              -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$UPDATED")

            echo "HTTP $HTTP_CODE"
            cat /tmp/response.txt
            echo ""

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "Failed to update $NAME"
              exit 1
            fi
          }

          update_service "hydration-api_app" "greenjay/hydration-api:${SHA}"
          update_service "hydration-api_jobs" "greenjay/hydration-api-jobs:${SHA}"
