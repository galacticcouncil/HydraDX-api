name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API app
        id: build-app
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-app
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api:latest
            greenjay/hydration-api:${{ github.sha }}

      - name: Build and push API jobs
        id: build-jobs
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-jobs
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api-jobs:latest
            greenjay/hydration-api-jobs:${{ github.sha }}

      - name: Redeploy on Swarm
        env:
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          JOBS_DIGEST: ${{ steps.build-jobs.outputs.digest }}
        run: |
          SERVICES=$(curl -s "${{ secrets.SWARMPIT_URL }}/api/services" \
            -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}")

          for SERVICE in "hydration-api_app" "hydration-api_jobs"; do
            if [ "$SERVICE" = "hydration-api_app" ]; then
              NEW_IMAGE="greenjay/hydration-api"
              NEW_DIGEST="$APP_DIGEST"
            else
              NEW_IMAGE="greenjay/hydration-api-jobs"
              NEW_DIGEST="$JOBS_DIGEST"
            fi

            SERVICE_DATA=$(echo "$SERVICES" | jq --arg name "$SERVICE" '.[] | select(.serviceName == $name)')
            SERVICE_ID=$(echo "$SERVICE_DATA" | jq -r '.id')
            if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "null" ]; then
              echo "Service $SERVICE not found"
              exit 1
            fi

            echo "Updating $SERVICE to $NEW_IMAGE:latest@$NEW_DIGEST..."
            UPDATED=$(echo "$SERVICE_DATA" | jq \
              --arg tag "latest" \
              --arg image "$NEW_IMAGE:latest" \
              --arg reponame "$NEW_IMAGE" \
              --arg digest "$NEW_DIGEST" \
              '.repository.tag = $tag | .repository.image = $image | .repository.name = $reponame | .repository.imageDigest = $digest')

            curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.SWARMPIT_URL }}/api/services/$SERVICE_ID" \
              -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$UPDATED"
            echo ""
          done
