version: "3.8"

x-api-common: &api-common
  environment:
    - DOCKER_RUN=1
    - REDIS_URL=redis://redis:6379
  secrets:
    - xcm_auth_header
  networks:
    - hydration-net
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    networks:
      - hydration-net
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  app:
    <<: *api-common
    image: ${IMAGE_API:-greenjay/hydration-api:latest}
    environment:
      - DOCKER_RUN=1
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NECKWORK_API_URL=https://hydration-api.neckwork.net
    networks:
      - hydration-net
      - gateway
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=gateway"
        - "traefik.http.routers.hydration-api.rule=Host(`api.nice.hydration.cloud`)"
        - "traefik.http.routers.hydration-api.entrypoints=websecure"
        - "traefik.http.routers.hydration-api.tls.certresolver=myresolver"
        - "traefik.http.routers.hydration-api.tls.domains[0].main=api.nice.hydration.cloud"
        - "traefik.http.services.hydration-api.loadbalancer.server.port=3000"
        - "traefik.http.routers.hydration-api-http.rule=Host(`api.nice.hydration.cloud`)"
        - "traefik.http.routers.hydration-api-http.entrypoints=web"
        - "traefik.http.routers.hydration-api-http.middlewares=https-redirect"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/app').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  jobs:
    <<: *api-common
    image: ${IMAGE_JOBS:-greenjay/hydration-api-jobs:latest}
    environment:
      - DOCKER_RUN=1
      - REDIS_URL=redis://redis:6379
      - JOB_NAME=cache-coingecko-tickers-job
      - CONTINUOUS_JOB=true
      - JOB_INTERVAL_MS=60000
      - NECKWORK_API_URL=https://hydration-api.neckwork.net
    secrets:
      - xcm_auth_header
      - pgpassword_db
      - pgpassword_db_fallback
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 256M

  monitor:
    <<: *api-common
    image: ${IMAGE_MONITOR:-greenjay/hydration-api-monitor:latest}
    environment:
      - DOCKER_RUN=1
      - REDIS_URL=redis://redis:6379
      - MONITOR_PORT=9090
      - DISCORD_CHANNEL_ID=884924771584860221
      - DEXSCREENER_STALE_THRESHOLD_SECONDS=600
      - ORCA_STALE_THRESHOLD_SECONDS=600
    secrets:
      - xcm_auth_header
      - discord_webhook_url
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    networks:
      - hydration-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=https://grafana.nice.hydration.cloud
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - hydration-net
      - gateway
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=gateway"
        - "traefik.http.routers.grafana.rule=Host(`grafana.nice.hydration.cloud`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=myresolver"
        - "traefik.http.routers.grafana.tls.domains[0].main=grafana.nice.hydration.cloud"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.grafana-http.rule=Host(`grafana.nice.hydration.cloud`)"
        - "traefik.http.routers.grafana-http.entrypoints=web"
        - "traefik.http.routers.grafana-http.middlewares=https-redirect"

networks:
  hydration-net:
    driver: overlay
    attachable: true
  gateway:
    external: true

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

configs:
  prometheus_config:
    external: true

secrets:
  xcm_auth_header:
    external: true
  discord_webhook_url:
    external: true
  pgpassword_db:
    external: true
  pgpassword_db_fallback:
    external: true
