name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API app
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-app
          platforms: linux/amd64
          push: true
          tags: greenjay/hydration-api:latest

      - name: Build and push API jobs
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-jobs
          platforms: linux/amd64
          push: true
          tags: greenjay/hydration-api-jobs:latest

      - name: Redeploy on Swarmpit
        run: |
          SERVICES=$(curl -s "${{ secrets.SWARMPIT_URL }}/api/services" \
            -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}")

          echo "Services response: $SERVICES"

          for SERVICE in "hydration-api_app" "hydration-api_jobs"; do
            SERVICE_ID=$(echo "$SERVICES" | jq -r --arg name "$SERVICE" '.[] | select(.name == $name) | .id')
            if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "null" ]; then
              echo "Service $SERVICE not found"
              exit 1
            fi
            echo "Redeploying $SERVICE ($SERVICE_ID)..."
            curl -s -X POST "${{ secrets.SWARMPIT_URL }}/api/services/$SERVICE_ID/redeploy" \
              -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}"
            echo "Done"
          done
