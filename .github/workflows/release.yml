name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API app
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-app
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api:latest
            greenjay/hydration-api:${{ github.sha }}

      - name: Build and push API jobs
        uses: docker/build-push-action@v3
        with:
          context: .
          target: api-jobs
          platforms: linux/amd64
          push: true
          tags: |
            greenjay/hydration-api-jobs:latest
            greenjay/hydration-api-jobs:${{ github.sha }}

      - name: Deploy stack on Swarmpit
        run: |
          SHA="${{ github.sha }}"

          # Read the compose file and substitute image tags with SHA
          COMPOSE=$(cat docker-stack.yml \
            | sed "s|greenjay/hydration-api:latest|greenjay/hydration-api:${SHA}|g" \
            | sed "s|greenjay/hydration-api-jobs:latest|greenjay/hydration-api-jobs:${SHA}|g")

          echo "Deploying stack with images tagged ${SHA} ..."

          # Use Swarmpit's stack update API (runs docker stack deploy internally)
          PAYLOAD=$(jq -n --arg name "hydration-api" --arg compose "$COMPOSE" \
            '{name: $name, spec: {compose: $compose}}')

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.SWARMPIT_URL }}/api/stacks/hydration-api" \
            -H "Authorization: ${{ secrets.SWARMPIT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          cat /tmp/response.txt
          echo ""

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Stack deploy failed"
            exit 1
          fi

          echo "Stack deployed successfully"
